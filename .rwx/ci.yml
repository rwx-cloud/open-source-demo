on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  - key: code
    call: git/clone 2.0.6
    with:
      repository: https://github.com/rwx-cloud/open-source-demo.git
      ref: ${{ init.commit-sha }}

  - key: test
    use: code
    run: cat file.txt
